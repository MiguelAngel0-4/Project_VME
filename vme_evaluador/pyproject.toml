[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vme-evaluador"
version = "1.0.0"
description = "Evaluador de árboles de decisión por Valor Monetario Esperado (VME)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
vme = "vme.cli:main"

[tool.setuptools]
packages = ["vme"]

[tool.pytest.ini_options]
testpaths = ["tests", "vme"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # permite caracteres como □ ○ ◁ en textos en español

[tool.mypy]
python_version = "3.10"
strict = true
